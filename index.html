<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Aura - Menstruationszyklus & Eisprung-Tracker</title>
    <meta name="theme-color" content="#FDF8F5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Aura">

    <!-- CDN online per evitare che la grafica e lo stile si disallineino -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rose: { 50: '#fff1f2', 100: '#ffe4e6', 200: '#fecdd3', 300: '#fda4af', 400: '#fb7185', 500: '#f43f5e', 600: '#e11d48' },
                        blush: '#FDF8F5', cream: '#FAF4EF', mauve: '#8E6C88', plum: '#4A2E35', sage: '#8A9A86'
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #FDF8F5; color: #4A2E35; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .glass-card { background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(253, 164, 175, 0.25); }
        input, select, textarea { font-size: 16px !important; }
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        @media (max-width: 767px) { .mobile-tabbar-spacer { padding-bottom: calc(76px + env(safe-area-inset-bottom)); } }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased mobile-tabbar-spacer">

    <header class="sticky top-0 z-40 bg-white/85 backdrop-blur-md border-b border-rose-100/60 shadow-sm safe-top">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 sm:h-20">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-rose-400 to-rose-300 flex items-center justify-center text-white shadow-md shadow-rose-200">
                        <i data-lucide="sparkles" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <span class="font-serif text-2xl font-bold text-plum">Aura</span>
                        <span class="hidden sm:inline text-xs font-semibold px-2 py-0.5 ml-2 bg-rose-100 text-rose-700 rounded-full uppercase">Zyklustracker</span>
                    </div>
                </div>

                <nav class="hidden md:flex space-x-1 bg-cream/80 p-1.5 rounded-2xl border border-rose-100">
                    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-tab px-5 py-2.5 rounded-xl text-sm font-medium bg-white text-rose-600 shadow-sm flex items-center gap-2">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Übersicht
                    </button>
                    <button onclick="switchTab('calendar')" id="nav-calendar" class="nav-tab px-5 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:text-rose-600 flex items-center gap-2">
                        <i data-lucide="calendar" class="w-4 h-4"></i> Kalender
                    </button>
                    <button onclick="switchTab('stats')" id="nav-stats" class="nav-tab px-5 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:text-rose-600 flex items-center gap-2">
                        <i data-lucide="bar-chart-3" class="w-4 h-4"></i> Statistik
                    </button>
                    <button onclick="switchTab('nutrition')" id="nav-nutrition" class="nav-tab px-5 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:text-rose-600 flex items-center gap-2">
                        <i data-lucide="apple" class="w-4 h-4"></i> Ernährung
                    </button>
                </nav>

                <div class="flex items-center gap-2">
                    <button onclick="openLogModal()" class="flex items-center justify-center gap-2 min-w-[44px] min-h-[44px] bg-gradient-to-r from-rose-500 to-rose-400 text-white font-medium px-4 py-2.5 rounded-xl text-sm shadow-md">
                        <i data-lucide="plus-circle" class="w-5 h-5"></i>
                        <span>Periode eintragen</span>
                    </button>
                    <button onclick="openSettingsModal()" class="p-2.5 text-slate-500 hover:text-rose-600 rounded-xl">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full">

        <section id="tab-dashboard" class="tab-content space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 glass-card rounded-3xl p-6 relative overflow-hidden flex flex-col justify-between shadow-sm">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-serif font-bold text-plum">Aktueller Zyklusstatus</h2>
                        <span id="current-date-badge" class="text-xs font-semibold text-slate-500 bg-white px-3 py-1.5 rounded-xl border">Heute</span>
                    </div>

                    <div class="flex flex-col sm:flex-row items-center justify-around gap-8 my-4">
                        <div class="relative w-48 h-48 flex items-center justify-center">
                            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="42" stroke="currentColor" stroke-width="8" class="text-rose-100" fill="transparent"></circle>
                                <circle id="cycle-progress-circle" cx="50" cy="50" r="42" stroke="currentColor" stroke-width="8" class="text-rose-500 transition-all duration-1000" fill="transparent" stroke-dasharray="263.89" stroke-dashoffset="130" stroke-linecap="round"></circle>
                            </svg>
                            <div class="absolute text-center">
                                <span id="current-cycle-day" class="block text-4xl font-serif font-bold text-plum">Tag 1</span>
                                <span id="total-cycle-length-label" class="text-xs text-slate-500">von 28 Tagen</span>
                            </div>
                        </div>

                        <div class="space-y-4 w-full sm:w-auto">
                            <div class="bg-white/90 p-4 rounded-2xl border border-rose-100 shadow-sm flex items-center gap-4">
                                <div class="w-12 h-12 rounded-xl bg-rose-100 flex items-center justify-center text-rose-600">
                                    <i data-lucide="droplet" class="w-6 h-6"></i>
                                </div>
                                <div>
                                    <div class="text-xs font-semibold text-slate-400 uppercase">Aktuelle Phase</div>
                                    <div id="current-phase-name" class="text-lg font-bold text-plum">Menstruation</div>
                                    <p id="current-phase-desc" class="text-xs text-slate-500">Ruhephase und Erholung.</p>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-white/70 p-3 rounded-2xl border">
                                    <span class="text-xs text-slate-400 block">Nächste Periode</span>
                                    <span id="next-period-countdown" class="text-sm font-bold text-rose-600">--</span>
                                </div>
                                <div class="bg-white/70 p-3 rounded-2xl border">
                                    <span class="text-xs text-slate-400 block">Eisprung</span>
                                    <span id="ovulation-countdown" class="text-sm font-bold text-purple-600">--</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="space-y-6">
                    <div class="bg-white rounded-3xl p-6 border border-rose-100 shadow-sm space-y-4">
                        <h3 class="font-serif font-bold text-lg text-plum">Zyklus-Kennzahlen</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-cream p-4 rounded-2xl text-center">
                                <span class="text-2xl font-bold font-serif text-plum block" id="avg-cycle-dash">28</span>
                                <span class="text-xs text-slate-500">Ø Zyklus (Tage)</span>
                            </div>
                            <div class="bg-cream p-4 rounded-2xl text-center">
                                <span class="text-2xl font-bold font-serif text-plum block" id="avg-period-dash">5</span>
                                <span class="text-xs text-slate-500">Ø Blutung (Tage)</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="tab-calendar" class="tab-content hidden space-y-6">
            <div class="bg-white rounded-3xl p-6 border border-rose-100 shadow-sm">
                <div class="flex justify-between items-center mb-6">
                    <button onclick="changeMonth(-1)" class="p-2 rounded-xl border"><i data-lucide="chevron-left"></i></button>
                    <h2 id="calendar-month-year" class="text-xl font-serif font-bold text-plum">Monat</h2>
                    <button onclick="changeMonth(1)" class="p-2 rounded-xl border"><i data-lucide="chevron-right"></i></button>
                </div>
                <div class="grid grid-cols-7 gap-2 mb-2 text-center text-xs font-bold text-slate-400 uppercase">
                    <div>So</div><div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div>
                </div>
                <div id="calendar-days-grid" class="grid grid-cols-7 gap-2"></div>
            </div>
        </section>

        <section id="tab-stats" class="tab-content hidden space-y-6">
            <div class="bg-white rounded-3xl p-6 border border-rose-100 shadow-sm">
                <h2 class="text-2xl font-serif font-bold text-plum mb-4">Zykluslängen-Analyse</h2>
                <div class="w-full h-72">
                    <canvas id="cycleChart"></canvas>
                </div>
            </div>
        </section>

        <section id="tab-nutrition" class="tab-content hidden space-y-6">
            <div id="nutrition-content-box" class="bg-white rounded-3xl p-6 border border-rose-100 shadow-sm"></div>
        </section>

    </main>

    <nav class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 border-t border-rose-100 p-2 flex justify-around safe-bottom">
        <button onclick="switchTab('dashboard')" class="flex flex-col items-center text-xs text-rose-600"><i data-lucide="layout-dashboard"></i> Übersicht</button>
        <button onclick="switchTab('calendar')" class="flex flex-col items-center text-xs text-slate-500"><i data-lucide="calendar"></i> Kalender</button>
        <button onclick="switchTab('stats')" class="flex flex-col items-center text-xs text-slate-500"><i data-lucide="bar-chart-3"></i> Statistik</button>
        <button onclick="switchTab('nutrition')" class="flex flex-col items-center text-xs text-slate-500"><i data-lucide="apple"></i> Ernährung</button>
    </nav>

    <script>
        let periodLogs = [
            { id: '1', startDate: '2026-09-23', endDate: '2026-09-27' },
            { id: '2', startDate: '2026-08-27', endDate: '2026-08-31' }
        ];
        let appSettings = { defaultCycleLength: 28, defaultBleedDuration: 5 };
        let currentCalendarDate = new Date();
        let cycleChartInstance = null;

        function formatDateISO(d) { return d.toISOString().split('T')[0]; }
        function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            updateDashboard();
            renderCalendar();
            initChart();
        });

        function updateDashboard() {
            document.getElementById('current-date-badge').textContent = new Date().toLocaleDateString('de-DE');
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-days-grid');
            if(!grid) return;
            grid.innerHTML = '';
            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            document.getElementById('calendar-month-year').textContent = new Date(year, month).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });

            const totalDays = new Date(year, month + 1, 0).getDate();
            for (let day = 1; day <= totalDays; day++) {
                const dateStr = formatDateISO(new Date(year, month, day));
                const isPeriod = periodLogs.some(l => dateStr >= l.startDate && dateStr <= l.endDate);
                const cell = document.createElement('div');
                cell.className = `h-16 p-2 rounded-2xl border flex flex-col justify-between ${isPeriod ? 'bg-rose-500 text-white font-bold' : 'bg-white text-slate-700'}`;
                cell.innerHTML = `<span>${day}</span>${isPeriod ? '<span class="text-[9px]">Periode</span>' : ''}`;
                grid.appendChild(cell);
            }
        }

        function changeMonth(delta) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + delta);
            renderCalendar();
        }

        function initChart() {
            const ctx = document.getElementById('cycleChart').getContext('2d');
            cycleChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Juli', 'Aug', 'Sept'],
                    datasets: [{ label: 'Zykluslänge (Tage)', data: [28, 29, 27], borderColor: '#f43f5e', fill: true, backgroundColor: 'rgba(244,63,94,0.1)' }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
        }
    </script>
</body>
</html>
